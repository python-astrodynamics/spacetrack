[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacetrack"
version = "1.4.0"
description = "Python client for space-track.org"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Frazer McLean", email = "frazer@frazermclean.co.uk" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "filelock>=3.17.0",
    "httpx>=0.28.1",
    "logbook>=1.8.0",
    "outcome>=1.3.0.post0",
    "platformdirs>=4.3.6",
    "python-dateutil>=2.9.0.post0; python_version < '3.11'",
    "represent>=2.1",
    "rush>=2021.4.0",
    "sniffio>=1.3.1",
]

[project.urls]
Repository = "https://github.com/python-astrodynamics/spacetrack"
Documentation = "https://spacetrack.readthedocs.io"

[dependency-groups]
dev = [
    { include-group = "check-sdist" },
    { include-group = "coverage" },
    { include-group = "nox" },
    { include-group = "test" },
    { include-group = "towncrier" },
    "ruff==0.15.16",
]
check-sdist = [
    "check-sdist>=1.5.0",
]
docs = [
    "furo>=2024.8.6",
    "parver>=0.5",
    "sphinx>=7.4.7",
]
docstest = [
    { include-group = "docs" },
    "doc8>=1.1.2",
]
coverage = [
    "coverage[toml]>=7.14.1",
]
nox = [
    "nox>=2026.4.10",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-trio>=0.8.0",
    "respx>=0.23.1",
]
towncrier = [
    "towncrier>=25.8.0",
]


[tool.coverage.run]
branch = true
source = ["spacetrack", "tests/"]
parallel = true

[tool.coverage.paths]
source = ["src/spacetrack", ".nox/**/site-packages/spacetrack"]

[tool.coverage.report]
precision = 1
exclude_lines = ["pragma: no cover", "^\\s*pass\\s*$"]

[tool.pytest]
addopts = ["-r", "s"]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", # ruff defaults
    "I", # isort
    "UP", # pyupgrade
    "RUF", # ruff
]
ignore = [
    "RUF012",
]

[tool.doc8]
ignore-path = ["docs/_build"]
ignore = ["D001"]

[tool.towncrier]
directory = "newsfragments"
filename = "docs/changelog.rst"
issue_format = "`#{issue} <https://github.com/python-astrodynamics/spacetrack/issues/{issue}>`_"
title_format = "`{version} <https://github.com/python-astrodynamics/spacetrack/releases/tag/{version}>`_ - {project_date}"
underlines = ["-", "~"]

[[tool.towncrier.type]]
name = "Added"

[[tool.towncrier.type]]
name = "Changed"

[[tool.towncrier.type]]
name = "Deprecated"

[[tool.towncrier.type]]
name = "Removed"

[[tool.towncrier.type]]
name = "Fixed"

[[tool.towncrier.type]]
name = "Security"
